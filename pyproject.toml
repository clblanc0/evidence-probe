[project]
name = "evidence-probe"
version = "0.1.0"
description = "Do LLMs register patient mix-ups internally, even when they file the record anyway?"
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn", "matplotlib", "joblib"]

[project.optional-dependencies]
model = ["torch", "transformers", "accelerate"]
dev = ["pytest", "nbformat"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
